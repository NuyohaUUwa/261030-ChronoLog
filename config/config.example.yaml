server:
  address: "127.0.0.1:8080"
  allowed_origins:
    - "http://127.0.0.1:5173"
    - "http://localhost:5173"
    - "http://127.0.0.1:8080"
    - "http://localhost:8080"
    - "https://chronolog.uufang.space"
    - "capacitor://localhost"

storage:
  data_dir: "data-dev"

app:
  timezone: "Asia/Shanghai"

auth:
  jwt_secret: "" # 启动必填，本地开发在 config.local.yaml 中生成并填写安全随机值
  token_expiry_hours: 720 # Token 有效期（小时）
  admin_setup_key: "" # 管理员首次注册必填；环境变量 ADMIN_SETUP_KEY 覆盖，真实值不得提交
  admin_emails:
    - "434322037@qq.com" # 具备管理提示词配置权限的管理员邮箱列表

ai:
  mode: "mock" # mock | remote
  # 支持 OpenAI / DeepSeek 等兼容接口：
  # OpenAI: base_url: "https://api.openai.com/v1", model: "gpt-4o-mini"
  # DeepSeek: base_url: "https://api.deepseek.com/v1", model: "deepseek-chat"
  base_url: "https://api.deepseek.com/v1"
  api_key: ""
  model: "deepseek-chat"
  timeout_seconds: 30

notifications:
  mode: "mock" # mock | remote
  channel: "bark" # bark | ntfy (优先支持单一实用渠道 Bark 或 Ntfy)
  bark_server: "https://api.day.app" # Bark 服务端地址（默认官方节点）
  ntfy_server: "https://ntfy.sh"
  app_base_url: "https://chronolog.uufang.space" # 用于通知推送的直达深链基地址
  check_interval_seconds: 60

prompts:
  file: "config/prompts.local.yaml"
